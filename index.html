<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Farebná paleta - INVASIA hmyzu (len na plátne)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: clamp(8px, 2vw, 40px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .main-container {
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: clamp(8px, 1.5vw, 40px);
            flex-wrap: wrap;
            margin-bottom: clamp(15px, 3vw, 80px);
        }

        .clock-window {
            background-color: #f0f0f0;
            border-radius: clamp(8px, 1.2vw, 30px);
            box-shadow: 0 0.2vw 0.6vw rgba(0,0,0,0.1);
            padding: clamp(8px, 1.2vw, 30px) clamp(12px, 1.8vw, 40px);
            width: 35%;
            min-width: 180px;
            border: 0.15vw solid #ddd;
        }

        .clock {
            font-size: clamp(20px, 4vw, 100px);
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.2vw;
            color: #333;
            background-color: #fff;
            padding: clamp(6px, 1vw, 25px) clamp(8px, 1.2vw, 30px);
            border-radius: clamp(6px, 0.8vw, 20px);
            text-align: center;
            width: 100%;
            word-break: break-word;
        }

        .checkbox-window {
            background-color: #f0f0f0;
            border-radius: clamp(8px, 1.2vw, 30px);
            box-shadow: 0 0.2vw 0.6vw rgba(0,0,0,0.1);
            padding: clamp(8px, 1.2vw, 30px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 10%;
            min-width: 70px;
            border: 0.15vw solid #ddd;
        }

        .big-checkbox input {
            width: clamp(25px, 3.5vw, 80px);
            height: clamp(25px, 3.5vw, 80px);
            cursor: pointer;
        }

        .color-window {
            background-color: #f0f0f0;
            border-radius: clamp(8px, 1.2vw, 30px);
            box-shadow: 0 0.2vw 0.6vw rgba(0,0,0,0.1);
            padding: clamp(6px, 0.8vw, 20px) clamp(10px, 1.5vw, 35px);
            flex: 1;
            min-width: 180px;
            border: 0.15vw solid #ddd;
        }

        .color-display {
            width: 100%;
            height: clamp(50px, 6vw, 150px);
            background-color: #000000;
            border: 0.2vw solid #333;
            border-radius: clamp(6px, 0.8vw, 20px);
            transition: background-color 0.2s ease;
        }

        .colors-section {
            margin-top: clamp(15px, 2.5vw, 60px);
        }

        .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(6px, 1.2vw, 30px);
            margin-bottom: clamp(15px, 2.5vw, 60px);
            justify-content: center;
        }

        .color-square {
            width: clamp(60px, 7vw, 250px);
            height: clamp(60px, 7vw, 250px);
            border-radius: clamp(5px, 0.8vw, 20px);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 0.15vw solid #ddd;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .color-square:active {
            transform: scale(0.95);
        }

        .extended-grid {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(5px, 0.8vw, 20px);
            margin-bottom: clamp(12px, 1.8vw, 40px);
            justify-content: center;
        }

        .extended-square {
            width: clamp(50px, 6vw, 220px);
            height: clamp(50px, 6vw, 220px);
            border-radius: clamp(4px, 0.6vw, 15px);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 0.15vw solid #ccc;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .extended-square:active {
            transform: scale(0.95);
        }

        .reboot-section {
            margin-top: clamp(20px, 3vw, 80px);
            padding: clamp(10px, 1.5vw, 40px);
            background-color: #f8f8f8;
            border-radius: clamp(10px, 1.5vw, 40px);
            text-align: center;
            border: 0.15vw solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.5vw, 60px);
            flex-wrap: wrap;
        }

        .reboot-buttons {
            display: flex;
            gap: clamp(8px, 1.5vw, 20px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .reboot-button {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: clamp(10px, 1.5vw, 35px) clamp(20px, 3vw, 70px);
            font-size: clamp(14px, 2vw, 48px);
            font-weight: bold;
            border-radius: clamp(8px, 1.2vw, 30px);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0.2vw 0.6vw rgba(0,0,0,0.15);
            touch-action: manipulation;
        }

        .invasion-button {
            background-color: #2266ff;
        }
        .invasion-button:active { transform: scale(0.98); background-color: #1144cc; }

        .reboot-button:active {
            transform: scale(0.98);
        }

        .counter-container {
            display: inline-flex;
            align-items: center;
            gap: clamp(8px, 1.2vw, 30px);
            background-color: white;
            padding: clamp(8px, 1.2vw, 30px) clamp(12px, 1.8vw, 45px);
            border-radius: clamp(8px, 1.2vw, 30px);
            box-shadow: 0 0.15vw 0.5vw rgba(0,0,0,0.1);
        }

        .counter-label {
            font-size: clamp(12px, 1.5vw, 36px);
            font-weight: bold;
            color: #333;
        }

        .counter-value {
            font-size: clamp(20px, 3.5vw, 80px);
            font-weight: bold;
            color: #ff4444;
            font-family: 'Courier New', monospace;
            min-width: clamp(40px, 5vw, 120px);
            text-align: center;
        }

        .draw-section {
            margin-top: clamp(20px, 3vw, 80px);
            position: relative;
        }
        
        .draw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(10px, 1.5vw, 35px);
            flex-wrap: wrap;
            gap: clamp(8px, 1.5vw, 20px);
        }
        
        .draw-title {
            font-size: clamp(14px, 1.8vw, 42px);
            font-weight: bold;
            color: #333;
        }
        
        .clear-button {
            padding: clamp(6px, 1vw, 20px) clamp(12px, 2vw, 40px);
            background-color: #666;
            color: white;
            border: none;
            border-radius: clamp(6px, 1vw, 25px);
            font-size: clamp(12px, 1.5vw, 32px);
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .clear-button:active {
            transform: scale(0.98);
            background-color: #555;
        }
        
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        #drawCanvas {
            border: 0.2vw solid #333;
            border-radius: clamp(6px, 1vw, 25px);
            background-color: white;
            cursor: crosshair;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0.15vw 0.6vw rgba(0,0,0,0.1);
            width: 100%;
            height: auto;
            touch-action: none;
            aspect-ratio: 16 / 5;
        }

        /* Hmyz canvas - vrstva nad kresliacim plátnom */
        .ant-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #effectCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: transparent;
        }

        .click-indicator {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .ant-counter {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #ffaa00;
            padding: 8px 15px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: stretch; }
            .clock-window, .checkbox-window, .color-window { width: 100%; min-width: auto; }
            .reboot-section { flex-direction: column; gap: clamp(12px, 2vw, 20px); }
            .reboot-buttons { width: 100%; flex-direction: row; flex-wrap: wrap; }
            .reboot-button { flex: 1; min-width: 120px; }
            .counter-container { width: 100%; justify-content: center; }
            .draw-header { flex-direction: column; align-items: stretch; }
            .draw-title { text-align: center; }
            .clear-button { width: 100%; white-space: normal; text-align: center; }
        }
        @media (max-width: 480px) {
            body { padding: clamp(5px, 1.5vw, 10px); }
            .color-square { width: clamp(45px, 12vw, 70px); height: clamp(45px, 12vw, 70px); }
            .extended-square { width: clamp(40px, 10vw, 60px); height: clamp(40px, 10vw, 60px); }
            .reboot-button { padding: clamp(8px, 2vw, 12px) clamp(12px, 3vw, 20px); font-size: clamp(12px, 3vw, 16px); }
            .counter-label { font-size: clamp(10px, 2.5vw, 14px); }
            .counter-value { font-size: clamp(16px, 4vw, 24px); min-width: clamp(35px, 8vw, 50px); }
            .draw-title { font-size: clamp(12px, 2.5vw, 16px); }
            .clear-button { font-size: clamp(10px, 2vw, 14px); padding: clamp(5px, 1.2vw, 8px) clamp(8px, 2vw, 12px); }
        }
        @media (hover: hover) {
            .color-square:hover, .extended-square:hover { transform: scale(1.02); box-shadow: 0 0.3vw 1vw rgba(0,0,0,0.2); }
            .reboot-button:hover { background-color: #ff2222; transform: scale(1.02); }
            .invasion-button:hover { background-color: #4488ff; }
            .clear-button:hover { background-color: #555; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <div class="clock-window"><div class="clock" id="clock">--:--:--</div></div>
            <div class="checkbox-window"><div class="big-checkbox"><input type="checkbox" id="hideSecondsCheckbox"></div></div>
            <div class="color-window"><div class="color-display" id="colorDisplay"></div></div>
        </div>

        <div class="colors-section"><div class="color-grid" id="basicColors"></div><div id="colorRows"></div></div>

        <div class="reboot-section">
            <div class="reboot-buttons">
                <button class="reboot-button invasion-button" id="invasionButton">🔵 INVASION</button>
                <button class="reboot-button" id="rebootButton">REBOOT</button>
                <button class="reboot-button" id="hammerButton">HAMMER REBOOT</button>
                <button class="reboot-button" id="nukeButton">NUKE</button>
            </div>
            <div class="counter-container"><span class="counter-label">DAMAGE:</span><span class="counter-value" id="counterValue">0</span></div>
        </div>

        <div class="draw-section">
            <div class="draw-header"><div class="draw-title">Kresliace plátno</div><button class="clear-button" id="clearButton">VYMAZAŤ PLÁTNO</button></div>
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="drawCanvas" width="1600" height="500"></canvas>
                <canvas id="antCanvas" class="ant-overlay" width="1600" height="500"></canvas>
            </div>
        </div>
    </div>

    <canvas id="effectCanvas"></canvas>

    <script>
        // ========== HMYZ - LEN NA KRESLIACOM PLÁTNE ==========
        (function() {
            const ANT_LIFESPAN = 30000;
            const LINE_WIDTH = 3;
            const ANT_SIZE = 200;
            const TRAIL_COLOR = "#000000";
            const STEP_PX = 35;
            const STEP_MS = 500;
            
            const ANT_IMAGES = [
                "https://raw.githubusercontent.com/noonnamex/EMTEST-Web/main/ckor.png",
                "https://raw.githubusercontent.com/noonnamex/EMTEST-Web/main/mravec.png",
                "https://raw.githubusercontent.com/noonnamex/EMTEST-Web/main/pavuk.png",
                "https://raw.githubusercontent.com/noonnamex/EMTEST-Web/main/mucha.png"
            ];
            
            let canvas = document.getElementById('antCanvas');
            const ctx = canvas.getContext('2d');
            let ants = [];
            let loadedImages = {};
            let imagesLoadedCount = 0;
            let intervalId = null;
            
            // Sledovanie veľkosti plátna
            let canvasRect = canvas.getBoundingClientRect();
            let canvasWidth = canvas.width;
            let canvasHeight = canvas.height;
            
            function updateCanvasSize() {
                const rect = canvas.getBoundingClientRect();
                canvasWidth = canvas.width;
                canvasHeight = canvas.height;
                canvasRect = rect;
            }
            
            // Konverzia obrazovkových súradníc na súradnice plátna
            function screenToCanvasCoords(screenX, screenY) {
                const rect = canvasRect;
                if (!rect || rect.width === 0) return null;
                const scaleX = canvasWidth / rect.width;
                const scaleY = canvasHeight / rect.height;
                const canvasX = (screenX - rect.left) * scaleX;
                const canvasY = (screenY - rect.top) * scaleY;
                if (canvasX < 0 || canvasX > canvasWidth || canvasY < 0 || canvasY > canvasHeight) return null;
                return { x: canvasX, y: canvasY };
            }
            
            function resizeCanvas() {
                canvas.width = drawCanvas.width;
                canvas.height = drawCanvas.height;
                canvasWidth = canvas.width;
                canvasHeight = canvas.height;
                updateCanvasSize();
                redrawEverything();
            }
            
            function loadAllImages() {
                for (let url of ANT_IMAGES) {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.src = url;
                    img.onload = (function(imgUrl) {
                        return function() { loadedImages[imgUrl] = this; imagesLoadedCount++; if(imagesLoadedCount === ANT_IMAGES.length) redrawEverything(); };
                    })(url);
                    img.onerror = (function(imgUrl) {
                        return function() { loadedImages[imgUrl] = null; imagesLoadedCount++; if(imagesLoadedCount === ANT_IMAGES.length) redrawEverything(); };
                    })(url);
                }
            }
            
            function getRandomAntImage() {
                const randomIndex = Math.floor(Math.random() * ANT_IMAGES.length);
                return loadedImages[ANT_IMAGES[randomIndex]];
            }
            
            function drawFallbackAnt(x, y, angle) {
                ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
                ctx.fillStyle = "#3a2210";
                ctx.beginPath(); ctx.ellipse(0,0, ANT_SIZE*0.45, ANT_SIZE*0.35,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-ANT_SIZE*0.4,0, ANT_SIZE*0.35, ANT_SIZE*0.3,0,0,Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(ANT_SIZE*0.45,-ANT_SIZE*0.1, ANT_SIZE*0.35, ANT_SIZE*0.3,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = "#5a3a1a";
                ctx.beginPath(); ctx.ellipse(ANT_SIZE*0.8,-ANT_SIZE*0.15, ANT_SIZE*0.35, ANT_SIZE*0.35,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(ANT_SIZE*0.95,-ANT_SIZE*0.28, ANT_SIZE*0.08,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(ANT_SIZE*0.97,-ANT_SIZE*0.3, ANT_SIZE*0.04,0,Math.PI*2); ctx.fill();
                ctx.restore();
            }
            
            function drawAnt(ant) {
                const img = ant.image;
                if(img && img.complete && img.naturalWidth > 0) {
                    ctx.save();
                    ctx.translate(ant.x, ant.y);
                    ctx.rotate(ant.angle + Math.PI/2);
                    ctx.drawImage(img, -ANT_SIZE/2, -ANT_SIZE/2, ANT_SIZE, ANT_SIZE);
                    ctx.restore();
                } else drawFallbackAnt(ant.x, ant.y, ant.angle);
            }
            
            function redrawEverything() {
                if(!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for(let ant of ants) {
                    if(ant.trailPoints && ant.trailPoints.length >= 2) {
                        ctx.beginPath(); ctx.lineWidth = LINE_WIDTH; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = TRAIL_COLOR;
                        ctx.moveTo(ant.trailPoints[0].x, ant.trailPoints[0].y);
                        for(let i=1;i<ant.trailPoints.length;i++) ctx.lineTo(ant.trailPoints[i].x, ant.trailPoints[i].y);
                        ctx.stroke();
                    } else if(ant.trailPoints && ant.trailPoints.length === 1) {
                        ctx.beginPath(); ctx.arc(ant.trailPoints[0].x, ant.trailPoints[0].y, LINE_WIDTH/1.5,0,Math.PI*2); ctx.fillStyle = TRAIL_COLOR; ctx.fill();
                    }
                }
                for(let ant of ants) { drawAnt(ant); }
            }
            
            function addTrailPoint(ant, x, y) {
                if(!ant.trailPoints.length) {
                    ant.trailPoints.push({x,y});
                    ctx.beginPath(); ctx.arc(x,y, LINE_WIDTH/1.5,0,Math.PI*2); ctx.fillStyle = TRAIL_COLOR; ctx.fill();
                    return;
                }
                const last = ant.trailPoints[ant.trailPoints.length-1];
                if(Math.hypot(x-last.x, y-last.y) < 2 && ant.trailPoints.length>5) return;
                ant.trailPoints.push({x,y});
                ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(x,y); ctx.lineWidth = LINE_WIDTH; ctx.strokeStyle = TRAIL_COLOR; ctx.stroke();
            }
            
            function stepMovement() {
                const now = Date.now();
                for(let ant of ants) {
                    if(Math.random() < 0.1) ant.angle += (Math.random() - 0.5) * Math.PI / 2;
                    let newX = ant.x + Math.cos(ant.angle) * STEP_PX;
                    let newY = ant.y + Math.sin(ant.angle) * STEP_PX;
                    
                    if(newX < ANT_SIZE/2) { newX = ANT_SIZE/2; ant.angle = Math.PI - ant.angle; }
                    if(newX > canvasWidth - ANT_SIZE/2) { newX = canvasWidth - ANT_SIZE/2; ant.angle = Math.PI - ant.angle; }
                    if(newY < ANT_SIZE/2) { newY = ANT_SIZE/2; ant.angle = -ant.angle; }
                    if(newY > canvasHeight - ANT_SIZE/2) { newY = canvasHeight - ANT_SIZE/2; ant.angle = -ant.angle; }
                    
                    const oldX = ant.x, oldY = ant.y;
                    ant.x = newX; ant.y = newY;
                    
                    const steps = Math.max(1, Math.ceil(Math.hypot(newX - oldX, newY - oldY) / 5));
                    for(let i = 1; i <= steps; i++) {
                        const t = i / steps;
                        addTrailPoint(ant, oldX + (newX - oldX) * t, oldY + (newY - oldY) * t);
                    }
                    if(now - ant.birthTime >= ANT_LIFESPAN) {
                        const idx = ants.indexOf(ant);
                        if(idx !== -1) ants.splice(idx, 1);
                    }
                }
                redrawEverything();
                if(window.updateAntCounterUI) window.updateAntCounterUI(ants.length);
            }
            
            window.createAnt = function(screenX, screenY) {
                updateCanvasSize();
                const canvasCoords = screenToCanvasCoords(screenX, screenY);
                if (!canvasCoords) return null;
                
                let x = canvasCoords.x;
                let y = canvasCoords.y;
                x = Math.min(Math.max(x, ANT_SIZE/2), canvasWidth - ANT_SIZE/2);
                y = Math.min(Math.max(y, ANT_SIZE/2), canvasHeight - ANT_SIZE/2);
                
                const angle = Math.random() * Math.PI * 2;
                const newAnt = {
                    x, y,
                    angle: angle,
                    trailPoints: [],
                    birthTime: Date.now(),
                    image: getRandomAntImage()
                };
                addTrailPoint(newAnt, x, y);
                ants.push(newAnt);
                if(window.updateAntCounterUI) window.updateAntCounterUI(ants.length);
                redrawEverything();
                return newAnt;
            };
            
            window.updateAntCounterUI = function(count) {
                let c = document.getElementById('antCounter');
                if(c) c.innerHTML = `🐜 Hmyzu: ${count}`;
            };
            
            window.clearAllAnts = function() {
                ants = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if(window.updateAntCounterUI) window.updateAntCounterUI(0);
            };
            
            // Inicializácia
            const drawCanvas = document.getElementById('drawCanvas');
            
            function updateCanvasRect() {
                const rect = canvas.getBoundingClientRect();
                canvasRect = rect;
                canvasWidth = canvas.width;
                canvasHeight = canvas.height;
            }
            
            window.addEventListener('resize', () => { 
                setTimeout(() => {
                    resizeCanvas(); 
                    updateCanvasRect();
                    redrawEverything();
                }, 100);
            });
            
            // Sledovanie posunu plátna
            window.addEventListener('scroll', () => { updateCanvasRect(); });
            
            resizeCanvas();
            loadAllImages();
            intervalId = setInterval(stepMovement, STEP_MS);
            window.updateAntCounterUI(0);
            
            // Pravidelné aktualizovanie pozície plátna
            setInterval(() => { updateCanvasRect(); }, 500);
        })();
        
        // ========== EFEKTY (HAMMER, NUKE, klikacie bodky) ==========
        const effectCanvas = document.getElementById("effectCanvas");
        const effectCtx = effectCanvas.getContext("2d");

        function resizeEffectCanvas() { effectCanvas.width = window.innerWidth; effectCanvas.height = window.innerHeight; }
        resizeEffectCanvas();
        window.addEventListener("resize", resizeEffectCanvas);

        function drawCrack(x, y, length, angle, depth) {
            if(depth <= 0 || length < 8) return;
            const x2 = x + Math.cos(angle) * length, y2 = y + Math.sin(angle) * length;
            effectCtx.beginPath(); effectCtx.moveTo(x, y); effectCtx.lineTo(x2, y2); effectCtx.stroke();
            drawCrack(x2, y2, length * 0.7, angle + (Math.random() - 0.5) * 0.7, depth - 1);
            drawCrack(x2, y2, length * 0.7, angle - (Math.random() - 0.5) * 0.7, depth - 1);
        }

        function hammerRebootEffect() {
            effectCtx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
            effectCtx.strokeStyle = "#2c2c2c"; effectCtx.lineWidth = 5; effectCtx.lineCap = "round";
            const btn = document.getElementById('hammerButton'), r = btn.getBoundingClientRect();
            const cx = r.left + r.width/2, cy = r.top + r.height/2;
            let cracks = 0;
            const interval = setInterval(() => {
                const angle = Math.random() * Math.PI * 2, len = 180 + Math.random() * 100;
                const ox = (Math.random() - 0.5) * 40, oy = (Math.random() - 0.5) * 40;
                drawCrack(cx + ox, cy + oy, len, angle, 3);
                if(++cracks >= 20) { clearInterval(interval); setTimeout(() => effectCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height), 3000); }
            }, 70);
        }

        function nukeRebootEffect() {
            effectCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height);
            let radius = 20;
            const maxR = Math.max(effectCanvas.width, effectCanvas.height);
            const cx = effectCanvas.width/2, cy = effectCanvas.height/2;
            effectCtx.fillStyle = "white"; effectCtx.fillRect(0,0,effectCanvas.width,effectCanvas.height);
            setTimeout(() => {
                effectCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height);
                let step = 0, steps = 11, rStep = maxR/steps;
                const iv = setInterval(() => {
                    effectCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height);
                    const grad = effectCtx.createRadialGradient(cx,cy,radius*0.2,cx,cy,radius);
                    grad.addColorStop(0,"rgba(255,220,100,1)"); grad.addColorStop(0.5,"rgba(255,100,30,0.8)"); grad.addColorStop(1,"rgba(0,0,0,0)");
                    effectCtx.fillStyle = grad; effectCtx.beginPath(); effectCtx.arc(cx,cy,radius,0,Math.PI*2); effectCtx.fill();
                    radius += rStep;
                    if(++step >= steps) {
                        clearInterval(iv);
                        let op = 0.8, fstep = 0;
                        const fiv = setInterval(() => {
                            effectCtx.fillStyle = `rgba(0,0,0,${op})`; effectCtx.fillRect(0,0,effectCanvas.width,effectCanvas.height);
                            op -= 0.16;
                            if(++fstep >= 5 || op <= 0) { clearInterval(fiv); setTimeout(() => effectCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height), 50); }
                        }, 40);
                    }
                }, 28);
            }, 50);
        }

        function createClickIndicator(x, y) {
            const indicator = document.createElement('div'); indicator.className = 'click-indicator';
            const dotSize = Math.max(14, Math.min(20, window.innerWidth * 0.065));
            const borderWidth = Math.max(1.5, Math.min(3, window.innerWidth * 0.004));
            const arrowSize = dotSize, gap = dotSize * 0.25;
            indicator.style.left = (x - dotSize/2) + 'px'; indicator.style.top = (y - dotSize/2 - arrowSize - gap) + 'px';
            indicator.style.width = dotSize + 'px'; indicator.style.height = (dotSize + arrowSize + gap) + 'px';
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%");
            svg.setAttribute("viewBox", `0 0 ${dotSize} ${dotSize + arrowSize + gap}`);
            const circleY = arrowSize + gap + dotSize/2;
            const circle = document.createElementNS(svgNS, "circle");
            circle.setAttribute("cx", dotSize/2); circle.setAttribute("cy", circleY);
            circle.setAttribute("r", dotSize/2 - borderWidth/2); circle.setAttribute("fill", "#ff3333");
            circle.setAttribute("stroke", "#ffcc00"); circle.setAttribute("stroke-width", borderWidth);
            svg.appendChild(circle);
            const arrowGroup = document.createElementNS(svgNS, "g");
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", dotSize/2); line.setAttribute("y1", gap + 5);
            line.setAttribute("x2", dotSize/2); line.setAttribute("y2", arrowSize + gap - 3);
            line.setAttribute("stroke", "#000000"); line.setAttribute("stroke-width", "2"); line.setAttribute("stroke-linecap", "round");
            arrowGroup.appendChild(line);
            const arrowWing = dotSize * 0.2;
            const arrowHead = document.createElementNS(svgNS, "polygon");
            arrowHead.setAttribute("points", `${dotSize/2},${arrowSize+gap-3} ${dotSize/2-arrowWing},${arrowSize+gap-3-arrowWing} ${dotSize/2+arrowWing},${arrowSize+gap-3-arrowWing}`);
            arrowHead.setAttribute("fill", "#000000");
            arrowGroup.appendChild(arrowHead);
            svg.appendChild(arrowGroup);
            indicator.appendChild(svg);
            document.body.appendChild(indicator);
            setTimeout(() => { if(indicator && indicator.parentNode) { indicator.style.transition = 'opacity 0.3s'; indicator.style.opacity = '0'; setTimeout(() => indicator.remove(), 300); } }, 10000);
        }
        
        document.addEventListener('click', e => { let x = e.clientX, y = e.clientY; if(x !== undefined) createClickIndicator(x, y); });
        document.addEventListener('touchstart', e => { if(e.touches && e.touches.length > 0) createClickIndicator(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        
        // ========== PÔVODNÝ KÓD FARIEB, HODÍN, KRESLENIA ==========
        const basicColors = [
            { name: "Red", code: "#FF0000" }, { name: "Green", code: "#00FF00" }, { name: "Blue", code: "#0000FF" },
            { name: "Cyan", code: "#00FFFF" }, { name: "Magenta", code: "#FF00FF" }, { name: "Yellow", code: "#FFFF00" },
            { name: "White", code: "#FFFFFF" }, { name: "Black", code: "#000000" }
        ];
        const colorRows = [
            { shades: ["#B30000","#CC0000","#E60000","#FF0000","#FF3333","#FF6666","#FF9999","#FFCCCC","#FFE5E5"] },
            { shades: ["#B36200","#CC7000","#E67E00","#FF8C00","#FFA033","#FFB466","#FFC899","#FFDCCC","#FFEEE6"] },
            { shades: ["#B3B300","#CCCC00","#E6E600","#FFFF00","#FFFF33","#FFFF66","#FFFF99","#FFFFCC","#FFFFE5"] },
            { shades: ["#00B300","#00CC00","#00E600","#00FF00","#33FF33","#66FF66","#99FF99","#CCFFCC","#E5FFE5"] },
            { shades: ["#0000B3","#0000CC","#0000E6","#0000FF","#3333FF","#6666FF","#9999FF","#CCCCFF","#E5E5FF"] },
            { shades: ["#6B00B3","#7A00CC","#8A00E6","#9900FF","#AD33FF","#C266FF","#D699FF","#EBCCFF","#F5E5FF"] },
            { shades: ["#666666","#808080","#999999","#B3B3B3","#CCCCCC","#E6E6E6","#F0F0F0","#F5F5F5","#FAFAFA"] }
        ];

        let rebootCounter = 0;
        function loadCounter() { const sc = localStorage.getItem('rebootCounter'); if(sc !== null) { rebootCounter = parseInt(sc); updateCounterDisplay(); } }
        function saveCounter() { localStorage.setItem('rebootCounter', rebootCounter); }
        function updateCounterDisplay() { document.getElementById('counterValue').textContent = rebootCounter; }
        function addDamage(a) { rebootCounter = (rebootCounter + a) % 10; updateCounterDisplay(); saveCounter(); }
        function reboot() { addDamage(1); }
        function hammerReboot() { addDamage(3); hammerRebootEffect(); }
        function nukeReboot() { addDamage(5); nukeRebootEffect(); }

        function updateClock() {
            const n = new Date();
            const h = String(n.getHours()).padStart(2,'0'), m = String(n.getMinutes()).padStart(2,'0'), s = String(n.getSeconds()).padStart(2,'0');
            document.getElementById('clock').textContent = document.getElementById('hideSecondsCheckbox').checked ? `${h}:${m}` : `${h}:${m}:${s}`;
        }

        let currentDrawColor = "#000000";
        function setColor(c) { document.getElementById('colorDisplay').style.backgroundColor = c; currentDrawColor = c; }

        let drawCanvas = document.getElementById('drawCanvas'), ctx = drawCanvas.getContext('2d'), drawing = false;
        function resizeDrawCanvas() { if(drawCanvas.width !== 1600 || drawCanvas.height !== 500) { drawCanvas.width = 1600; drawCanvas.height = 500; } ctx.strokeStyle = currentDrawColor; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
        function getCanvasCoords(e) {
            const rect = drawCanvas.getBoundingClientRect(), sx = drawCanvas.width / rect.width, sy = drawCanvas.height / rect.height;
            let cx, cy; if(e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } else { cx = e.clientX; cy = e.clientY; }
            let x = (cx - rect.left) * sx, y = (cy - rect.top) * sy;
            return { x: Math.max(0, Math.min(drawCanvas.width, x)), y: Math.max(0, Math.min(drawCanvas.height, y)) };
        }
        function startDraw(e) { e.preventDefault(); drawing = true; const {x,y} = getCanvasCoords(e); ctx.beginPath(); ctx.moveTo(x,y); }
        function drawMove(e) { if(!drawing) return; e.preventDefault(); const {x,y} = getCanvasCoords(e); ctx.strokeStyle = currentDrawColor; ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y); }
        function stopDraw(e) { if(e) e.preventDefault(); drawing = false; ctx.beginPath(); }
        function clearDrawCanvas() { ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height); ctx.beginPath(); }
        
        resizeDrawCanvas();
        drawCanvas.addEventListener('mousedown', startDraw); drawCanvas.addEventListener('mousemove', drawMove); drawCanvas.addEventListener('mouseup', stopDraw);
        drawCanvas.addEventListener('mouseleave', stopDraw); drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
        drawCanvas.addEventListener('touchmove', drawMove, { passive: false }); drawCanvas.addEventListener('touchend', stopDraw);
        drawCanvas.addEventListener('touchcancel', stopDraw); drawCanvas.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('resize', () => { ctx.strokeStyle = currentDrawColor; });
        
        function renderBasicColors() {
            const cont = document.getElementById('basicColors'); cont.innerHTML = '';
            basicColors.forEach(c => { const sq = document.createElement('div'); sq.className = 'color-square'; sq.style.backgroundColor = c.code; sq.title = c.name; sq.onclick = () => setColor(c.code); sq.ontouchstart = e => { e.preventDefault(); setColor(c.code); }; cont.appendChild(sq); });
        }
        function renderColorRows() {
            const cont = document.getElementById('colorRows'); cont.innerHTML = '';
            colorRows.forEach(row => { const grid = document.createElement('div'); grid.className = 'extended-grid'; grid.style.width = '100%'; row.shades.forEach(sh => { const sq = document.createElement('div'); sq.className = 'extended-square'; sq.style.backgroundColor = sh; sq.title = sh; sq.onclick = () => setColor(sh); sq.ontouchstart = e => { e.preventDefault(); setColor(sh); }; grid.appendChild(sq); }); cont.appendChild(grid); });
        }

        loadCounter(); renderBasicColors(); renderColorRows(); updateClock(); setInterval(updateClock, 1000);
        document.getElementById('hideSecondsCheckbox').addEventListener('change', updateClock);
        document.getElementById('rebootButton').addEventListener('click', reboot); document.getElementById('rebootButton').addEventListener('touchstart', e => { e.preventDefault(); reboot(); });
        document.getElementById('hammerButton').addEventListener('click', hammerReboot); document.getElementById('hammerButton').addEventListener('touchstart', e => { e.preventDefault(); hammerReboot(); });
        document.getElementById('nukeButton').addEventListener('click', nukeReboot); document.getElementById('nukeButton').addEventListener('touchstart', e => { e.preventDefault(); nukeReboot(); });
        setColor("#000000");
        document.getElementById('clearButton').onclick = clearDrawCanvas; document.getElementById('clearButton').ontouchstart = e => { e.preventDefault(); clearDrawCanvas(); };
        
        // INVASION button - vytvorí hmyz na plátne
        document.getElementById('invasionButton').addEventListener('click', (e) => { 
            e.stopPropagation(); 
            const rect = drawCanvas.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            window.createAnt(centerX, centerY); 
        });
        document.getElementById('invasionButton').addEventListener('touchstart', (e) => { 
            e.preventDefault(); e.stopPropagation(); 
            const rect = drawCanvas.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            window.createAnt(centerX, centerY); 
        });
    </script>
</body>
</html>
